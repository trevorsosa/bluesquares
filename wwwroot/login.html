<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066CC;
            --light-blue: #E6F2FF;
            --dark-blue: #004A99;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            margin: 0;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }

        .logo {
            max-width: 200px;
            margin: 0 auto 30px;
            display: block;
        }

        .btn-primary {
            background: var(--primary-blue);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50px;
        }

        .btn-primary:hover {
            background: var(--dark-blue);
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #ddd;
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #ddd;
        }

        .social-btn {
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            border: 1px solid #d8e2f0;
            background: #fff;
        }

        .social-btn:hover {
            background: #f8fbff;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="login-container">
            <img src="/img/Logo.png" alt="BlueSquares" class="logo">
            <h2 class="text-center mb-4">Welcome Back</h2>

            <div id="error-message" class="alert alert-danger" style="display: none;"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <span id="login-btn-text">Login</span>
                    <span id="login-spinner" class="spinner-border spinner-border-sm" style="display: none;"></span>
                </button>
                <div class="text-center">
                    <a href="/forgot-password">Forgot password?</a>
                </div>
            </form>

            <div class="divider">OR</div>

            <div class="d-grid gap-2 mb-3">
                <button type="button" class="btn social-btn" id="google-login-btn">
                    <i class="bi bi-google me-2"></i> Continue with Google
                </button>
                <button type="button" class="btn social-btn" id="facebook-login-btn">
                    <i class="bi bi-facebook me-2"></i> Continue with Facebook
                </button>
            </div>

            <div class="text-center">
                <p>Don't have an account? <a href="/signup">Sign up</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            loginWithEmail,
            loginWithProvider,
            googleProvider,
            facebookProvider,
            storeSession,
            fetchMerchantProfile,
            rememberPendingSocialProfile,
            friendlyAuthError
        } from '/js/firebase-client.js';

        async function finishLogin(user, providerName = '') {
            const token = await storeSession(user, user.email || '');
            const profileResponse = await fetchMerchantProfile(token);

            if (profileResponse.ok) {
                window.location.href = '/dashboard';
                return;
            }

            if (profileResponse.status === 404) {
                rememberPendingSocialProfile({
                    token,
                    email: user.email || '',
                    name: user.displayName || '',
                    provider: providerName
                });
                window.location.href = '/signup?completeProfile=1';
                return;
            }

            throw new Error('Unable to load merchant profile.');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn-text');
            const spinner = document.getElementById('login-spinner');

            errorDiv.style.display = 'none';
            loginBtn.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                const userCredential = await loginWithEmail(email, password);
                await finishLogin(userCredential.user, 'password');
            } catch (error) {
                errorDiv.textContent = friendlyAuthError(error);
                errorDiv.style.display = 'block';
                loginBtn.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });

        async function handleSocialLogin(provider, providerName) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'none';

            try {
                const result = await loginWithProvider(provider);
                await finishLogin(result.user, providerName);
            } catch (error) {
                errorDiv.textContent = friendlyAuthError(error);
                errorDiv.style.display = 'block';
            }
        }

        document.getElementById('google-login-btn').addEventListener('click', () => handleSocialLogin(googleProvider, 'google'));
        document.getElementById('facebook-login-btn').addEventListener('click', () => handleSocialLogin(facebookProvider, 'facebook'));
    </script>
</body>
</html>
