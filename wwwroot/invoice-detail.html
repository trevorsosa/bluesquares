<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Detail - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; left: 0; top: 0; width: 250px; padding: 20px 0; }
        .main-content { margin-left: 250px; padding: 30px; }
        .nav-link { color: #333; padding: 12px 20px; display: flex; align-items: center; }
        .nav-link.active, .nav-link:hover { background: #E6F2FF; color: #0066CC; }
        .nav-link i { margin-right: 10px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4">
            <img src="/img/Logo.png" alt="BlueSquares" style="max-width:150px;">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/dashboard"><i class="bi bi-grid"></i> Dashboard</a>
            <a class="nav-link active" href="/invoices"><i class="bi bi-file-text"></i> Invoices</a>
            <a class="nav-link" href="/clients"><i class="bi bi-people"></i> Clients</a>
            <a class="nav-link" href="/queries"><i class="bi bi-chat-dots"></i> Queries</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="mb-1" id="invoice-title">Invoice</h1>
                <p class="text-muted mb-0" id="invoice-subtitle">Loading invoice details...</p>
            </div>
            <a href="/invoices" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Back to Invoices</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body" id="invoice-summary">Loading invoice summary...</div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Line Items</h5>
                        <div id="line-items-list"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Actions</h5>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="send-btn">Send Invoice</button>
                            <button class="btn btn-outline-success" id="mark-paid-btn">Mark as Paid</button>
                            <a class="btn btn-outline-secondary" id="public-view-btn" target="_blank">Open Public Invoice</a>
                            <a class="btn btn-outline-secondary" id="pdf-btn" target="_blank">Download PDF</a>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Accounting Export</h5>
                        <p class="text-muted small">Push this invoice to your connected accounting system.</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary" onclick="exportInvoice('xero')">Export to Xero</button>
                            <button class="btn btn-outline-primary" onclick="exportInvoice('quickbooks')">Export to QuickBooks</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '/login';

        const invoiceId = new URLSearchParams(window.location.search).get('id');
        let invoice = null;

        async function loadInvoice() {
            const result = await apiJson(`/api/invoices/${invoiceId}`);
            if (!result || !result.ok) {
                showToast('Could not load invoice.', 'error');
                return;
            }

            invoice = result.data;
            document.getElementById('invoice-title').textContent = invoice.invoiceNumber;
            document.getElementById('invoice-subtitle').textContent = `${invoice.client.name} • ${invoice.status}`;
            document.getElementById('public-view-btn').href = `/invoice/${invoice.id}`;
            document.getElementById('pdf-btn').href = `/api/invoices/${invoice.id}/pdf`;

            document.getElementById('invoice-summary').innerHTML = `
                <div class="row g-3">
                    <div class="col-md-6"><strong>Client</strong><div>${escapeHtml(invoice.client.name)}</div></div>
                    <div class="col-md-6"><strong>Due Date</strong><div>${formatDate(invoice.dueDate)}</div></div>
                    <div class="col-md-6"><strong>Status</strong><div><span class="badge ${getStatusBadgeClass(invoice.status)}">${escapeHtml(invoice.status)}</span></div></div>
                    <div class="col-md-6"><strong>Total</strong><div>${formatCurrency(invoice.totalAmount, invoice.currency)}</div></div>
                    <div class="col-12"><strong>Notes</strong><div>${escapeHtml(invoice.notes || 'No notes added')}</div></div>
                </div>
            `;

            document.getElementById('line-items-list').innerHTML = invoice.lineItems.length
                ? invoice.lineItems.map(item => `
                    <div class="d-flex justify-content-between border-bottom py-2">
                        <div>
                            <div class="fw-semibold">${escapeHtml(item.description)}</div>
                            <div class="small text-muted">${item.quantity} × ${formatCurrency(item.unitPrice, invoice.currency)}</div>
                        </div>
                        <div>${formatCurrency(item.total, invoice.currency)}</div>
                    </div>
                `).join('')
                : '<div class="text-muted">No line items found.</div>';

            document.getElementById('send-btn').disabled = invoice.status === 'Paid';
            document.getElementById('mark-paid-btn').disabled = invoice.status === 'Paid';
        }

        document.getElementById('send-btn').addEventListener('click', async () => {
            const result = await apiJson(`/api/invoices/${invoiceId}/send`, {
                method: 'POST',
                body: JSON.stringify({ sendEmail: true })
            });

            if (!result || !result.ok) {
                showToast(result?.data?.message || 'Could not send invoice.', 'error');
                return;
            }

            showToast('Invoice sent.', 'success');
            await loadInvoice();
        });

        document.getElementById('mark-paid-btn').addEventListener('click', async () => {
            const paymentReference = prompt('Optional payment reference');
            const result = await apiJson(`/api/invoices/${invoiceId}/mark-paid`, {
                method: 'POST',
                body: JSON.stringify({ paymentReference, sendReceipt: true })
            });

            if (!result || !result.ok) {
                showToast('Could not mark invoice as paid.', 'error');
                return;
            }

            showToast('Invoice marked as paid.', 'success');
            await loadInvoice();
        });

        async function exportInvoice(provider) {
            const result = await apiJson(`/api/accounting-integrations/${provider}/export/${invoiceId}`, {
                method: 'POST'
            });

            if (!result || !result.ok) {
                showToast(result?.data?.message || `Could not export to ${provider}.`, 'error');
                return;
            }

            showToast(result.data.message, 'success');
        }

        loadInvoice();
    </script>
</body>
</html>
