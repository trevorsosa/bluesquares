<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; left: 0; top: 0; width: 250px; padding: 20px 0; }
        .main-content { margin-left: 250px; padding: 30px; }
        .nav-link { color: #333; padding: 12px 20px; display: flex; align-items: center; }
        .nav-link.active, .nav-link:hover { background: #E6F2FF; color: #0066CC; }
        .nav-link i { margin-right: 10px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4">
            <img src="/img/Logo.png" alt="BlueSquares" style="max-width:150px;">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/dashboard"><i class="bi bi-grid"></i> Dashboard</a>
            <a class="nav-link" href="/invoices"><i class="bi bi-file-text"></i> Invoices</a>
            <a class="nav-link active" href="/clients"><i class="bi bi-people"></i> Clients</a>
            <a class="nav-link" href="/queries"><i class="bi bi-chat-dots"></i> Queries</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="mb-1">Clients</h1>
                <p class="text-muted mb-0">Manage the customers you invoice regularly.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Add Client</h5>
                        <form id="client-form" class="row g-3">
                            <input type="hidden" id="client-id">
                            <div class="col-12">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" id="client-name" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">WhatsApp Number</label>
                                <input type="text" class="form-control" id="client-whatsapp" placeholder="+27812345678" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="client-email">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="client-company">
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Save Client</button>
                                <button type="button" class="btn btn-outline-secondary" id="reset-client-form">Clear</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Your Clients</h5>
                            <span class="badge bg-light text-dark border" id="client-count">0 clients</span>
                        </div>
                        <div id="clients-list" class="d-grid gap-3">
                            <div class="text-center py-4 text-muted">Loading clients...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '/login';

        let clients = [];

        async function loadClients() {
            const result = await apiJson('/api/clients');
            if (!result || !result.ok) {
                showToast('Could not load clients.', 'error');
                return;
            }

            clients = result.data || [];
            document.getElementById('client-count').textContent = `${clients.length} client${clients.length === 1 ? '' : 's'}`;

            const list = document.getElementById('clients-list');
            if (!clients.length) {
                list.innerHTML = '<div class="text-center py-4 text-muted">No clients yet. Add your first client to start invoicing.</div>';
                return;
            }

            list.innerHTML = clients.map(client => `
                <div class="border rounded-4 p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                        <div>
                            <h6 class="mb-1">${escapeHtml(client.name)}</h6>
                            <div class="small text-muted">${escapeHtml(client.companyName || 'Individual client')}</div>
                            <div class="small mt-2"><i class="bi bi-whatsapp"></i> ${escapeHtml(client.whatsAppNumber)}</div>
                            <div class="small">${client.email ? `<i class="bi bi-envelope"></i> ${escapeHtml(client.email)}` : 'No email saved'}</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="editClient('${client.id}')">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteClient('${client.id}')">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function editClient(clientId) {
            const client = clients.find(item => item.id === clientId);
            if (!client) return;

            document.getElementById('client-id').value = client.id;
            document.getElementById('client-name').value = client.name || '';
            document.getElementById('client-whatsapp').value = client.whatsAppNumber || '';
            document.getElementById('client-email').value = client.email || '';
            document.getElementById('client-company').value = client.companyName || '';
        }

        async function deleteClient(clientId) {
            if (!confirm('Delete this client?')) return;

            const response = await apiCall(`/api/clients/${clientId}`, { method: 'DELETE' });
            if (!response || !response.ok) {
                showToast('Could not delete client. They may already have invoices.', 'error');
                return;
            }

            showToast('Client deleted.', 'success');
            resetForm();
            await loadClients();
        }

        function resetForm() {
            document.getElementById('client-form').reset();
            document.getElementById('client-id').value = '';
        }

        document.getElementById('reset-client-form').addEventListener('click', resetForm);

        document.getElementById('client-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const clientId = document.getElementById('client-id').value;
            const payload = {
                name: document.getElementById('client-name').value.trim(),
                whatsAppNumber: document.getElementById('client-whatsapp').value.trim(),
                email: document.getElementById('client-email').value.trim(),
                companyName: document.getElementById('client-company').value.trim()
            };

            const endpoint = clientId ? `/api/clients/${clientId}` : '/api/clients';
            const method = clientId ? 'PUT' : 'POST';
            const response = await apiCall(endpoint, {
                method,
                body: JSON.stringify(payload)
            });

            if (!response || !response.ok) {
                showToast('Could not save client.', 'error');
                return;
            }

            showToast(clientId ? 'Client updated.' : 'Client created.', 'success');
            resetForm();
            await loadClients();
        });

        loadClients();
    </script>
</body>
</html>
