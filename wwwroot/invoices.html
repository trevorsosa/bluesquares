<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; left: 0; top: 0; width: 250px; padding: 20px 0; }
        .main-content { margin-left: 250px; padding: 30px; }
        .nav-link { color: #333; padding: 12px 20px; display: flex; align-items: center; }
        .nav-link.active, .nav-link:hover { background: #E6F2FF; color: #0066CC; }
        .nav-link i { margin-right: 10px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4">
            <img src="/img/Logo.png" alt="BlueSquares" style="max-width:150px;">
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/dashboard"><i class="bi bi-grid"></i> Dashboard</a>
            <a class="nav-link active" href="/invoices"><i class="bi bi-file-text"></i> Invoices</a>
            <a class="nav-link" href="/clients"><i class="bi bi-people"></i> Clients</a>
            <a class="nav-link" href="/queries"><i class="bi bi-chat-dots"></i> Queries</a>
            <a class="nav-link" href="/settings"><i class="bi bi-gear"></i> Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="mb-1">Invoices</h1>
                <p class="text-muted mb-0">Manage one-off invoices and monthly recurring billing.</p>
            </div>
            <a href="/create-invoice" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Create Invoice</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Recent Invoices</h5>
                            <span class="badge bg-light text-dark border" id="invoice-count">0 invoices</span>
                        </div>
                        <div id="invoice-list" class="d-grid gap-3">
                            <div class="text-center py-4 text-muted">Loading invoices...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Create Monthly Recurring Invoice</h5>
                        <form id="recurring-form" class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Schedule Name</label>
                                <input type="text" class="form-control" id="schedule-name" placeholder="Monthly retainer">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Client</label>
                                <select class="form-select" id="schedule-client" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Send Day</label>
                                <input type="number" class="form-control" id="schedule-day" min="1" max="28" value="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Due After (days)</label>
                                <input type="number" class="form-control" id="schedule-due-days" min="1" value="7">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Notes</label>
                                <textarea class="form-control" id="schedule-notes" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Line Item Description</label>
                                <input type="text" class="form-control" id="schedule-description" placeholder="Monthly service fee" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="schedule-quantity" min="0.01" step="0.01" value="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Unit Price</label>
                                <input type="number" class="form-control" id="schedule-unit-price" min="0" step="0.01" value="0">
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="schedule-send-whatsapp" checked>
                                    <label class="form-check-label" for="schedule-send-whatsapp">Auto-send on WhatsApp</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="schedule-send-email">
                                    <label class="form-check-label" for="schedule-send-email">Auto-send by email</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100">Save Monthly Schedule</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Recurring Schedules</h5>
                            <span class="badge bg-light text-dark border" id="schedule-count">0 schedules</span>
                        </div>
                        <div id="schedule-list" class="d-grid gap-3">
                            <div class="text-center py-4 text-muted">Loading schedules...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '/login';

        let merchantCurrency = 'ZAR';

        async function loadPageData() {
            const [invoiceResult, scheduleResult, clientResult, profileResult] = await Promise.all([
                apiJson('/api/invoices?limit=20'),
                apiJson('/api/recurring-invoices'),
                apiJson('/api/clients'),
                apiJson('/api/merchants/profile')
            ]);

            if (!invoiceResult?.ok || !scheduleResult?.ok || !clientResult?.ok || !profileResult?.ok) {
                showToast('Could not load invoices page.', 'error');
                return;
            }

            merchantCurrency = profileResult.data.currency || 'ZAR';
            renderInvoices(invoiceResult.data || []);
            renderSchedules(scheduleResult.data || []);
            renderClientOptions(clientResult.data || []);
        }

        function renderInvoices(invoices) {
            document.getElementById('invoice-count').textContent = `${invoices.length} invoice${invoices.length === 1 ? '' : 's'}`;
            const container = document.getElementById('invoice-list');

            if (!invoices.length) {
                container.innerHTML = '<div class="text-center py-4 text-muted">No invoices yet.</div>';
                return;
            }

            container.innerHTML = invoices.map(invoice => `
                <div class="border rounded-4 p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                        <div>
                            <h6 class="mb-1">${escapeHtml(invoice.invoiceNumber)}</h6>
                            <div class="small text-muted">${escapeHtml(invoice.client.name)}</div>
                            <div class="small mt-2">Due ${formatDate(invoice.dueDate)}</div>
                        </div>
                        <div class="text-end">
                            <div class="fw-semibold">${formatCurrency(invoice.totalAmount, invoice.currency)}</div>
                            <span class="badge ${getStatusBadgeClass(invoice.status)}">${escapeHtml(invoice.status)}</span>
                            <div class="mt-2">
                                <a class="btn btn-sm btn-outline-primary" href="/invoice-detail?id=${invoice.id}">Open</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderSchedules(schedules) {
            document.getElementById('schedule-count').textContent = `${schedules.length} schedule${schedules.length === 1 ? '' : 's'}`;
            const container = document.getElementById('schedule-list');

            if (!schedules.length) {
                container.innerHTML = '<div class="text-center py-4 text-muted">No recurring schedules yet.</div>';
                return;
            }

            container.innerHTML = schedules.map(schedule => `
                <div class="border rounded-4 p-3 bg-white">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                        <div>
                            <h6 class="mb-1">${escapeHtml(schedule.name)}</h6>
                            <div class="small text-muted">${escapeHtml(schedule.client.name)} • every month on day ${schedule.dayOfMonth}</div>
                            <div class="small mt-2">Next run: ${formatDate(schedule.nextRunDate)}</div>
                            <div class="small">Amount: ${formatCurrency(schedule.totalAmount, schedule.currency)}</div>
                        </div>
                        <div class="text-end">
                            <span class="badge ${schedule.isActive ? 'bg-success' : 'bg-secondary'}">${schedule.isActive ? 'Active' : 'Paused'}</span>
                            <div class="mt-2 d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary" onclick="toggleSchedule('${schedule.id}')">${schedule.isActive ? 'Pause' : 'Resume'}</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteSchedule('${schedule.id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderClientOptions(clients) {
            document.getElementById('schedule-client').innerHTML = clients.length
                ? clients.map(client => `<option value="${client.id}">${escapeHtml(client.name)}</option>`).join('')
                : '<option value="">Add a client first</option>';
        }

        async function toggleSchedule(scheduleId) {
            const result = await apiJson(`/api/recurring-invoices/${scheduleId}/toggle`, { method: 'POST' });
            if (!result || !result.ok) {
                showToast('Could not update recurring schedule.', 'error');
                return;
            }

            showToast(result.data.message, 'success');
            await loadPageData();
        }

        async function deleteSchedule(scheduleId) {
            if (!confirm('Delete this recurring schedule?')) return;

            const result = await apiJson(`/api/recurring-invoices/${scheduleId}`, { method: 'DELETE' });
            if (!result || !result.ok) {
                showToast('Could not delete recurring schedule.', 'error');
                return;
            }

            showToast('Recurring schedule deleted.', 'success');
            await loadPageData();
        }

        document.getElementById('recurring-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                clientId: document.getElementById('schedule-client').value,
                name: document.getElementById('schedule-name').value.trim(),
                dayOfMonth: Number(document.getElementById('schedule-day').value || 1),
                dueDaysAfterIssue: Number(document.getElementById('schedule-due-days').value || 7),
                notes: document.getElementById('schedule-notes').value.trim(),
                autoSendWhatsApp: document.getElementById('schedule-send-whatsapp').checked,
                autoSendEmail: document.getElementById('schedule-send-email').checked,
                lineItems: [{
                    description: document.getElementById('schedule-description').value.trim(),
                    quantity: Number(document.getElementById('schedule-quantity').value || 1),
                    unitPrice: Number(document.getElementById('schedule-unit-price').value || 0)
                }]
            };

            const result = await apiJson('/api/recurring-invoices', {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            if (!result || !result.ok) {
                showToast(result?.data?.message || 'Could not create recurring schedule.', 'error');
                return;
            }

            showToast('Recurring schedule saved.', 'success');
            event.target.reset();
            document.getElementById('schedule-send-whatsapp').checked = true;
            await loadPageData();
        });

        loadPageData();
    </script>
</body>
</html>
