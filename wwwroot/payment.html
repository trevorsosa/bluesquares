<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Payment - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066CC;
            --light-blue: #E6F2FF;
        }

        body {
            background: var(--light-blue);
            padding: 20px;
        }

        .payment-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .invoice-summary {
            background: var(--light-blue);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .payment-option {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-option:hover {
            border-color: var(--primary-blue);
            background: var(--light-blue);
        }

        .payment-option.selected {
            border-color: var(--primary-blue);
            background: var(--light-blue);
        }

        .btn-pay {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            width: 100%;
        }

        .btn-pay:hover {
            background: #218838;
            color: white;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="text-center mb-4">
            <img src="/img/Logo.png" alt="BlueSquares" style="max-width: 150px;">
            <h2 class="mt-3">Make Payment</h2>
        </div>

        <div id="payment-content">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading payment options...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id') || window.location.pathname.split('/').pop();

        let invoiceData = null;
        let selectedMethod = null;

        async function loadPaymentPage() {
            try {
                const response = await fetch(`/api/public/invoice/${invoiceId}`);
                
                if (!response.ok) {
                    throw new Error('Invoice not found');
                }

                invoiceData = await response.json();
                
                if (invoiceData.invoice.status === 'Paid') {
                    showAlreadyPaid();
                    return;
                }

                displayPaymentOptions();
            } catch (error) {
                console.error('Error loading invoice:', error);
                document.getElementById('payment-content').innerHTML = `
                    <div class="alert alert-danger">
                        <h4>Error</h4>
                        <p>Unable to load invoice. Please try again or contact support.</p>
                    </div>
                `;
            }
        }

        function showAlreadyPaid() {
            document.getElementById('payment-content').innerHTML = `
                <div class="alert alert-success">
                    <h4><i class="bi bi-check-circle"></i> Already Paid</h4>
                    <p>This invoice has already been paid. Thank you!</p>
                    <a href="/invoice/${invoiceId}" class="btn btn-primary mt-3">View Invoice</a>
                </div>
            `;
        }

        function displayPaymentOptions() {
            const { invoice, merchant } = invoiceData;
            const country = merchant.country || 'ZA';

            // Determine which online gateways are available
            const hasStripe = merchant.stripeEnabled;
            const hasPayPal = merchant.payPalEnabled;
            const hasPaystack = merchant.paystackEnabled;
            const hasPayFast = merchant.payFastEnabled;
            const hasOzow = merchant.ozowEnabled;
            const hasOnline = hasStripe || hasPayPal || hasPaystack || hasPayFast || hasOzow;

            // Determine if bank transfer is configured
            const hasBankTransfer = merchant.bankName || merchant.bankIban;

            const content = `
                <div class="invoice-summary">
                    <h5>${merchant.businessName}</h5>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Invoice #:</span>
                        <strong>${invoice.invoiceNumber}</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Due Date:</span>
                        <span>${formatDate(invoice.dueDate)}</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <strong>Total Amount:</strong>
                        <strong class="text-primary" style="font-size: 1.5rem;">${formatCurrency(invoice.totalAmount, invoice.currency)}</strong>
                    </div>
                </div>

                <h5 class="mb-3">Choose Payment Method</h5>

                ${hasStripe ? `
                <div class="payment-option" onclick="selectPaymentMethod('stripe', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-credit-card"></i> Card Payment <span class="badge bg-light text-dark border ms-1" style="font-size:0.7rem">Stripe</span></h6>
                            <small class="text-muted">Pay securely with your credit or debit card</small>
                        </div>
                        <input type="radio" name="payment-method" value="stripe">
                    </div>
                </div>
                ` : ''}

                ${hasPayPal ? `
                <div class="payment-option" onclick="selectPaymentMethod('paypal', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-paypal"></i> PayPal</h6>
                            <small class="text-muted">Pay with your PayPal account or card</small>
                        </div>
                        <input type="radio" name="payment-method" value="paypal">
                    </div>
                </div>
                ` : ''}

                ${hasPaystack ? `
                <div class="payment-option" onclick="selectPaymentMethod('paystack', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-credit-card"></i> Card Payment <span class="badge bg-light text-dark border ms-1" style="font-size:0.7rem">Paystack</span></h6>
                            <small class="text-muted">Pay securely with your card</small>
                        </div>
                        <input type="radio" name="payment-method" value="paystack">
                    </div>
                </div>
                ` : ''}

                ${hasPayFast ? `
                <div class="payment-option" onclick="selectPaymentMethod('payfast', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-credit-card"></i> Card / Instant EFT <span class="badge bg-light text-dark border ms-1" style="font-size:0.7rem">PayFast</span></h6>
                            <small class="text-muted">Card or instant EFT via PayFast</small>
                        </div>
                        <input type="radio" name="payment-method" value="payfast">
                    </div>
                </div>
                ` : ''}

                ${hasOzow ? `
                <div class="payment-option" onclick="selectPaymentMethod('ozow', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-bank"></i> Instant EFT <span class="badge bg-light text-dark border ms-1" style="font-size:0.7rem">Ozow</span></h6>
                            <small class="text-muted">Pay instantly from your bank account</small>
                        </div>
                        <input type="radio" name="payment-method" value="ozow">
                    </div>
                </div>
                ` : ''}

                ${hasBankTransfer ? `
                <div class="payment-option" onclick="selectPaymentMethod('bank', event)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1"><i class="bi bi-bank2"></i> ${country === 'ZA' ? 'Bank Transfer / EFT' : 'Bank Transfer'}</h6>
                            <small class="text-muted">Transfer directly to the business bank account</small>
                        </div>
                        <input type="radio" name="payment-method" value="bank">
                    </div>
                </div>
                ` : ''}

                ${!hasOnline && !hasBankTransfer ? `
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle"></i>
                    No online payment options are configured. Please contact the merchant directly.
                </div>
                ` : ''}

                <div id="payment-details" class="mt-4" style="display: none;"></div>

                <button id="pay-button" class="btn btn-pay mt-4" style="display: none;" onclick="processPayment()">
                    <i class="bi bi-lock"></i> Continue to Secure Payment
                </button>

                <div class="text-center mt-4">
                    <small class="text-muted">
                        <i class="bi bi-shield-check"></i> Your payment is secure and encrypted
                    </small>
                </div>
            `;

            document.getElementById('payment-content').innerHTML = content;
        }

        function selectPaymentMethod(method, event) {
            selectedMethod = method;

            document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
            if (event && event.currentTarget) event.currentTarget.classList.add('selected');

            const detailsDiv = document.getElementById('payment-details');
            const payButton = document.getElementById('pay-button');

            if (method === 'bank') {
                const { merchant, invoice } = invoiceData;
                const country = merchant.country || 'ZA';
                let bankRows = '';

                if (country === 'IE' && merchant.bankIban) {
                    // Ireland: IBAN / BIC / SEPA
                    bankRows = `
                        ${merchant.bankName ? `<tr><td><strong>Bank:</strong></td><td>${merchant.bankName}</td></tr>` : ''}
                        <tr><td><strong>IBAN:</strong></td><td>${merchant.bankIban}</td></tr>
                        ${merchant.bankBic ? `<tr><td><strong>BIC / SWIFT:</strong></td><td>${merchant.bankBic}</td></tr>` : ''}
                        <tr><td><strong>Account Holder:</strong></td><td>${merchant.accountHolderName || merchant.businessName}</td></tr>
                    `;
                } else if (country === 'GB') {
                    // UK: Account number + Sort code
                    bankRows = `
                        ${merchant.bankName ? `<tr><td><strong>Bank:</strong></td><td>${merchant.bankName}</td></tr>` : ''}
                        ${merchant.accountNumber ? `<tr><td><strong>Account Number:</strong></td><td>${merchant.accountNumber}</td></tr>` : ''}
                        ${merchant.branchCode ? `<tr><td><strong>Sort Code:</strong></td><td>${merchant.branchCode}</td></tr>` : ''}
                        <tr><td><strong>Account Holder:</strong></td><td>${merchant.accountHolderName || merchant.businessName}</td></tr>
                    `;
                } else {
                    // South Africa uses standard local bank transfer details
                    bankRows = `
                        ${merchant.bankName ? `<tr><td><strong>Bank:</strong></td><td>${merchant.bankName}</td></tr>` : ''}
                        ${merchant.accountNumber ? `<tr><td><strong>Account Number:</strong></td><td>${merchant.accountNumber}</td></tr>` : ''}
                        ${merchant.branchCode ? `<tr><td><strong>Branch Code:</strong></td><td>${merchant.branchCode}</td></tr>` : ''}
                        <tr><td><strong>Account Holder:</strong></td><td>${merchant.accountHolderName || merchant.businessName}</td></tr>
                    `;
                }

                detailsDiv.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h6>${country === 'ZA' ? 'EFT / Bank Transfer Details' : 'Bank Transfer Details'}</h6>
                            <table class="table table-borderless table-sm">
                                ${bankRows}
                                <tr><td><strong>Reference:</strong></td><td><span class="badge bg-warning text-dark">${invoice.paymentRefCode}</span></td></tr>
                                <tr><td><strong>Amount:</strong></td><td><strong>${formatCurrency(invoice.totalAmount, invoice.currency)}</strong></td></tr>
                            </table>
                            <div class="alert alert-warning">
                                <small><i class="bi bi-exclamation-triangle"></i>
                                Always use reference <strong>${invoice.paymentRefCode}</strong> so your payment is matched correctly.</small>
                            </div>
                        </div>
                    </div>
                `;
                detailsDiv.style.display = 'block';
                payButton.style.display = 'none';
            } else {
                detailsDiv.innerHTML = `
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> You'll be redirected to a secure payment page to complete your payment.
                    </div>
                `;
                detailsDiv.style.display = 'block';
                payButton.style.display = 'block';
            }
        }

        async function processPayment() {
            if (!selectedMethod || selectedMethod === 'bank') return;

            const payButton = document.getElementById('pay-button');
            payButton.disabled = true;
            payButton.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Redirecting...';

            try {
                let paymentUrl = '';

                const endpointMap = {
                    stripe:   { url: `/api/payment/stripe/${invoiceId}`,   key: 'paymentUrl' },
                    paypal:   { url: `/api/payment/paypal/${invoiceId}`,    key: 'paymentUrl' },
                    paystack: { url: `/api/payment/paystack/${invoiceId}`,  key: 'authorizationUrl' },
                    payfast:  { url: `/api/payment/payfast/${invoiceId}`,   key: 'paymentUrl' },
                    ozow:     { url: `/api/payment/ozow/${invoiceId}`,      key: 'paymentUrl' }
                };

                const endpoint = endpointMap[selectedMethod];
                if (endpoint) {
                    const res = await fetch(endpoint.url);
                    const data = await res.json();
                    paymentUrl = data[endpoint.key];
                }

                if (paymentUrl) {
                    window.location.href = paymentUrl;
                } else {
                    throw new Error('Payment gateway not configured');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error processing payment. Please try again.');
                payButton.disabled = false;
                payButton.innerHTML = '<i class="bi bi-lock"></i> Continue to Secure Payment';
            }
        }

        function formatCurrency(amount, currency) {
            const symbols = { 'ZAR': 'R', 'GBP': '£', 'EUR': '€' };
            const symbol = symbols[currency] || currency;
            const locale = currency === 'ZAR' ? 'en-ZA' : currency === 'EUR' ? 'en-IE' : 'en-GB';
            return `${symbol}${Number(amount).toLocaleString(locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        // Load payment page
        loadPaymentPage();
    </script>
</body>
</html>
