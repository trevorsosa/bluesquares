<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BlueSquares</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #004A99;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            min-height: 100vh;
            margin: 0;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.28);
            max-width: 460px;
            width: 100%;
        }

        .logo {
            max-width: 200px;
            margin: 0 auto 28px;
            display: block;
        }

        .btn-primary {
            background: var(--primary-blue);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 50px;
        }

        .btn-primary:hover {
            background: var(--dark-blue);
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <img src="/img/Logo.png" alt="BlueSquares" class="logo">
            <h2 class="text-center mb-3">Reset your password</h2>
            <p class="text-center text-muted mb-4">Enter your email and we’ll send you a password reset link.</p>

            <div id="error-message" class="alert alert-danger" style="display: none;"></div>
            <div id="success-message" class="alert alert-success" style="display: none;"></div>

            <form id="forgot-password-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <span id="reset-btn-text">Send reset link</span>
                    <span id="reset-spinner" class="spinner-border spinner-border-sm" style="display: none;"></span>
                </button>
            </form>

            <div class="text-center">
                <a href="/login">Back to login</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { sendResetEmail, friendlyAuthError } from '/js/firebase-client.js';

        document.getElementById('forgot-password-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const buttonText = document.getElementById('reset-btn-text');
            const spinner = document.getElementById('reset-spinner');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            buttonText.style.display = 'none';
            spinner.style.display = 'inline-block';

            try {
                await sendResetEmail(email);
                successDiv.textContent = 'Password reset email sent. Check your inbox and spam folder.';
                successDiv.style.display = 'block';
            } catch (error) {
                errorDiv.textContent = friendlyAuthError(error);
                errorDiv.style.display = 'block';
            } finally {
                buttonText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
